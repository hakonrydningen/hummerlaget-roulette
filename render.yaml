services:
  - type: web
    name: hummerlaget-roulette
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: HOST_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hummerlaget-roulette-db
          property: connectionString
